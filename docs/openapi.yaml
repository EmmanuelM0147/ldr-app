openapi: 3.0.3
info:
  title: Closer API
  version: 0.1.0
  description: Contract for Closer. Times are UTC. Clients convert with the user's IANA timezone.
servers:
  - url: http://localhost:8000
tags:
  - name: meta
  - name: auth
  - name: pairing
  - name: events
  - name: visits
  - name: check-ins
  - name: memories
  - name: presence
  - name: ai
security:
  - bearerAuth: []
paths:
  /:
    get:
      tags: [meta]
      operationId: getRoot
      security: []
      summary: API root
      responses:
        "200":
          description: API is reachable; points at docs and health
          content:
            application/json:
              schema:
                type: object
                required: [service, docs, health]
                properties:
                  service:
                    type: string
                  docs:
                    type: string
                  health:
                    type: string
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      security: []
      summary: Service health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Registration rejected (generic; does not reveal if the email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/Limited"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/Limited"
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      summary: Request a password reset link
      description: >
        Always returns 200 with a generic message (no email enumeration).
        Email delivery is not wired yet. When AUTH_RESET_DEBUG=1 and the email
        exists, the response may include reset_url for local/demo tests only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Generic acknowledgement (same whether or not the email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/Limited"
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      summary: Set a new password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          description: Invalid, used, or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/Limited"
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Update profile or password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
  /me/avatar:
    post:
      tags: [auth]
      operationId: uploadMyAvatar
      summary: Upload or replace the caller's profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP up to 5 MiB
      responses:
        "200":
          description: Updated user with avatar_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [auth]
      operationId: deleteMyAvatar
      summary: Remove the caller's profile photo
      responses:
        "200":
          description: Updated user without avatar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_id}/avatar:
    get:
      tags: [auth]
      operationId: getUserAvatar
      summary: Profile photo for the caller or their couple partner
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
  /couples:
    post:
      tags: [pairing]
      operationId: createCouple
      summary: Create a couple space
      responses:
        "201":
          description: Space created. Caller is member one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Couple"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /couples/current:
    get:
      tags: [pairing]
      operationId: getCurrentCouple
      summary: The caller's couple space
      responses:
        "200":
          description: Current space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Couple"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
    delete:
      tags: [pairing]
      operationId: deleteCurrentCouple
      summary: Delete the couple space and its data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoupleDelete"
      responses:
        "204":
          description: Space and couple-owned rows deleted. User accounts remain.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
    patch:
      tags: [pairing]
      operationId: updateCurrentCouple
      summary: Update couple preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouplePatch"
      responses:
        "200":
          description: Updated couple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Couple"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
  /couples/current/invites:
    post:
      tags: [pairing]
      operationId: createInvite
      summary: Create a single-use invite code
      responses:
        "201":
          description: Code shown once. Only a hash is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/Limited"
  /couples/join:
    post:
      tags: [pairing]
      operationId: joinCouple
      summary: Join a couple with an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "200":
          description: Caller is member two
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Couple"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/Limited"
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List calendar events for the caller's couple
      responses:
        "200":
          description: Events ordered by starts_at
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
    post:
      tags: [events]
      operationId: createEvent
      summary: Add a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventWrite"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
  /events/{event_id}:
    patch:
      tags: [events]
      operationId: updateEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPatch"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [events]
      operationId: deleteEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Event deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
  /visits:
    get:
      tags: [visits]
      operationId: listVisits
      summary: List visits for the caller's couple
      responses:
        "200":
          description: Visits ordered by starts_at
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
    post:
      tags: [visits]
      operationId: createVisit
      summary: Plan a visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitWrite"
      responses:
        "201":
          description: Visit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /visits/next:
    get:
      tags: [visits]
      operationId: getNextVisit
      summary: Soonest future visit and the countdown
      responses:
        "200":
          description: Empty visit when nothing is upcoming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
  /visits/{visit_id}:
    patch:
      tags: [visits]
      operationId: updateVisit
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitPatch"
      responses:
        "200":
          description: Visit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [visits]
      operationId: deleteVisit
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "204":
          description: Visit and its budget deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
  /visits/{visit_id}/budget:
    get:
      tags: [visits]
      operationId: getBudget
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: Budget for the visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
    put:
      tags: [visits]
      operationId: putBudget
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetWrite"
      responses:
        "200":
          description: Budget saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
  /check-ins:
    get:
      tags: [check-ins]
      operationId: listCheckIns
      summary: Check-ins for the caller's couple
      responses:
        "200":
          description: Newest local dates first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
  /check-ins/today:
    put:
      tags: [check-ins]
      operationId: upsertTodayCheckIn
      summary: Create or update today's check-in in the caller's timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInWrite"
      responses:
        "200":
          description: Today's check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
  /memories:
    get:
      tags: [memories]
      operationId: listMemories
      summary: Memories for the caller's couple
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
    post:
      tags: [memories]
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryWrite"
      responses:
        "201":
          description: Memory saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
  /memories/upload:
    post:
      tags: [memories]
      operationId: createMemoryWithMedia
      summary: Create a memory with an optional photo or video
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                title:
                  type: string
                  maxLength: 80
                  nullable: true
                body:
                  type: string
                  maxLength: 2000
                  description: Optional when a file is attached
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP (10 MiB) or MP4, WebM (40 MiB)
      responses:
        "201":
          description: Memory saved with media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
  /memories/{memory_id}:
    patch:
      tags: [memories]
      operationId: updateMemory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryPatch"
      responses:
        "200":
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [memories]
      operationId: deleteMemory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "204":
          description: Memory deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
  /memories/{memory_id}/media:
    get:
      tags: [memories]
      operationId: getMemoryMedia
      summary: Download media for a memory in the caller's couple
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Media bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
  /presence:
    get:
      tags: [presence]
      operationId: getPresence
      summary: Both members' free-to-talk flags
      description: >
        Returns both members' flags. A `free_to_talk` flag older than 30 minutes
        (no refresh) is cleared to false before the response.
      responses:
        "200":
          description: Presence for this couple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
    put:
      tags: [presence]
      operationId: setPresence
      summary: Set the caller's free-to-talk flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceWrite"
      responses:
        "200":
          description: Updated presence for this couple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
  /ws:
    get:
      tags: [presence]
      operationId: coupleEvents
      summary: WebSocket for couple live updates
      description: >
        After the upgrade, the first text frame is JSON `{"token":"<access token>"}`.
        The server closes the socket with code 1008 when that token is missing
        or invalid, or when the caller has no couple space. Later frames from
        the server are LiveEvent values, sent only to sockets in that couple.
        When the caller's last socket for the couple disconnects, their
        `free_to_talk` flag is cleared and the couple is notified.
        When a second member joins via invite code, connected peers receive
        `partner_joined` with the updated couple.
        When either member deletes the space, connected peers receive
        `{"type":"couple_gone"}` before memberships are removed.
      responses:
        "101":
          description: Switching protocols
  /ai/date-ideas:
    post:
      tags: [ai]
      operationId: createDateIdeas
      summary: Suggest date-night ideas
      description: >
        Requires the couple's `ai_enabled` to be true. Uses Google Gemini with
        GEMINI_API_KEY and GEMINI_MODEL from the server environment only.
        Only the form fields (duration, budget, mode, optional mood) are sent.
        Prompt and reply text are never written to logs. Limited to 10 requests
        per couple per UTC day. On model failure the API returns a friendly
        fallback idea list (200), not a 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DateIdeasRequest"
      responses:
        "200":
          description: Three to five date ideas (or a safe fallback list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateIdeas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Missing"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          description: Couple daily AI request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Model provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VisitId:
      name: visit_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invite code is missing, used, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Couple has not opted into AI features
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Missing:
      description: Not found for this caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The action conflicts with the current couple
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: The body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Limited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, timezone, created_at, avatar_url]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        timezone:
          type: string
          description: IANA timezone name
        created_at:
          type: string
          format: date-time
        avatar_url:
          type: string
          nullable: true
          description: Path to GET /users/{id}/avatar when a photo is set
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        timezone:
          type: string
          default: UTC
          description: IANA timezone name. Defaults to UTC.
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        timezone:
          type: string
          description: IANA timezone name
        current_password:
          type: string
          minLength: 8
          maxLength: 72
          description: Required when setting a new password
        new_password:
          type: string
          minLength: 8
          maxLength: 72
    CouplePatch:
      type: object
      additionalProperties: false
      properties:
        ai_enabled:
          type: boolean
          description: Couple-level AI opt-in. Off by default. Either partner may change it.
    CoupleDelete:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must be exactly DELETE (typed confirmation; not UI-only).
          enum: [DELETE]
    DateIdeasRequest:
      type: object
      additionalProperties: false
      required: [duration_minutes, budget, mode]
      properties:
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 720
          description: How long the date can last, in minutes. Not logged.
        budget:
          type: string
          minLength: 1
          maxLength: 80
          description: Budget as free text (for example "5000 NGN" or "low"). Not logged.
        mode:
          type: string
          enum: [together, apart]
          description: In-person together or remote while apart.
        mood:
          type: string
          maxLength: 80
          description: Optional short mood. Treated as data, never as instructions. Not logged.
    DateIdea:
      type: object
      additionalProperties: false
      required: [title, description, est_cost]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
        est_cost:
          type: string
          minLength: 1
          maxLength: 80
          description: Estimated cost as short text (for example "₦3,000" or "free").
    DateIdeas:
      type: object
      additionalProperties: false
      required: [ideas]
      properties:
        ideas:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/DateIdea"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ForgotPasswordResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
        reset_url:
          type: string
          nullable: true
          description: >
            Present only when AUTH_RESET_DEBUG=1 and a token was issued.
            Never enabled by default in production.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 8
          maxLength: 72
    ResetPasswordResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
    AuthResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          enum: [3600]
        user:
          $ref: "#/components/schemas/User"
    Member:
      type: object
      additionalProperties: false
      required: [user_id, display_name, timezone, joined_at, avatar_url]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        timezone:
          type: string
        joined_at:
          type: string
          format: date-time
        avatar_url:
          type: string
          nullable: true
          description: Path to GET /users/{id}/avatar when a photo is set
    Couple:
      type: object
      additionalProperties: false
      required: [id, ai_enabled, created_at, members]
      properties:
        id:
          type: string
          format: uuid
        ai_enabled:
          type: boolean
          description: Couple-level AI opt-in. Default false.
        created_at:
          type: string
          format: date-time
        members:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/Member"
    InviteCreated:
      type: object
      additionalProperties: false
      required: [code, expires_at]
      properties:
        code:
          type: string
        expires_at:
          type: string
          format: date-time
    JoinRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 8
    Event:
      type: object
      additionalProperties: false
      required: [id, couple_id, created_by, title, starts_at, ends_at, location, notes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        couple_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventWrite:
      type: object
      additionalProperties: false
      required: [title, starts_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          maxLength: 120
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
    EventPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          maxLength: 120
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
    BudgetShare:
      type: object
      additionalProperties: false
      required: [user_id, amount_minor]
      properties:
        user_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 0
    Budget:
      type: object
      additionalProperties: false
      required: [currency, total_minor, shares]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        total_minor:
          type: integer
          minimum: 0
        shares:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BudgetShare"
    BudgetWrite:
      type: object
      additionalProperties: false
      required: [currency, total_minor, shares]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        total_minor:
          type: integer
          minimum: 0
        shares:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BudgetShare"
    Visit:
      type: object
      additionalProperties: false
      required: [id, couple_id, created_by, title, starts_at, ends_at, location, notes, traveler_user_id, budget, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        couple_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        traveler_user_id:
          type: string
          format: uuid
          nullable: true
          description: Couple member who is traveling for this visit
        budget:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Budget"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VisitWrite:
      type: object
      additionalProperties: false
      required: [title, starts_at, ends_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 120
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        traveler_user_id:
          type: string
          format: uuid
          nullable: true
          description: Optional couple member who is traveling
        budget:
          allOf:
            - $ref: "#/components/schemas/BudgetWrite"
          nullable: true
          description: Optional split set when both partners are in the space
    VisitPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 120
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        traveler_user_id:
          type: string
          format: uuid
          nullable: true
    Countdown:
      type: object
      additionalProperties: false
      required: [visit, seconds_until]
      properties:
        visit:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Visit"
        seconds_until:
          type: integer
          minimum: 0
          nullable: true
    CheckIn:
      type: object
      additionalProperties: false
      required: [id, couple_id, user_id, local_date, mood, note, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        couple_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        local_date:
          type: string
          format: date
        mood:
          $ref: "#/components/schemas/Mood"
        note:
          type: string
          nullable: true
          maxLength: 280
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CheckInWrite:
      type: object
      additionalProperties: false
      required: [mood]
      properties:
        mood:
          $ref: "#/components/schemas/Mood"
        note:
          type: string
          nullable: true
          maxLength: 280
    Mood:
      type: string
      enum: [great, good, okay, low, rough]
    MemoryMedia:
      type: object
      additionalProperties: false
      required: [kind, content_type, filename, url]
      properties:
        kind:
          type: string
          enum: [image, video]
        content_type:
          type: string
        filename:
          type: string
        url:
          type: string
          description: Authenticated path to download the file
    Memory:
      type: object
      additionalProperties: false
      required: [id, couple_id, author_id, title, body, media, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        couple_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          maxLength: 80
        body:
          type: string
        media:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MemoryMedia"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryWrite:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        title:
          type: string
          nullable: true
          maxLength: 80
        body:
          type: string
          minLength: 1
          maxLength: 2000
    MemoryPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          maxLength: 80
        body:
          type: string
          minLength: 1
          maxLength: 2000
    Presence:
      type: object
      additionalProperties: false
      required: [user_id, free_to_talk, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        free_to_talk:
          type: boolean
        updated_at:
          type: string
          format: date-time
    PresenceList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Presence"
    PresenceWrite:
      type: object
      additionalProperties: false
      required: [free_to_talk]
      properties:
        free_to_talk:
          type: boolean
    LiveEvent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, members]
          properties:
            type:
              type: string
              enum: [presence]
            members:
              type: array
              items:
                $ref: "#/components/schemas/Presence"
        - type: object
          additionalProperties: false
          required: [type, check_in]
          properties:
            type:
              type: string
              enum: [check_in]
            check_in:
              $ref: "#/components/schemas/CheckIn"
        - type: object
          additionalProperties: false
          required: [type, couple]
          properties:
            type:
              type: string
              enum: [partner_joined]
              description: A second member joined the space via invite code.
            couple:
              $ref: "#/components/schemas/Couple"
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [couple_gone]
              description: The couple space was deleted; clients should clear local couple state.
