openapi: 3.0.3
info:
  title: Closer API
  version: 0.1.0
  description: API for Closer, a two-person space for long-distance couples.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
