name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: closer-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: closer-web:ci
          build-args: |
            VITE_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    # Deploy only from main after lint/tests/image builds succeed.
    # Set repository variable DEPLOY_ENABLED=true once AWS secrets exist (see docs/deploy.md).
    needs: [backend, frontend, build-images]
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE_API: ${{ secrets.ECS_SERVICE_API }}
          ECS_SERVICE_WEB: ${{ secrets.ECS_SERVICE_WEB }}
        run: |
          missing=0
          for name in AWS_ROLE_ARN ECR_REGISTRY ECS_CLUSTER ECS_SERVICE_API ECS_SERVICE_WEB; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Deploy secrets are not configured. See docs/deploy.md."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          SHA: ${{ github.sha }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/closer-api:$SHA" -t "$REGISTRY/closer-api:latest" ./backend
          docker build \
            --build-arg "VITE_API_URL=${VITE_API_URL:?set repository variable VITE_API_URL}" \
            -t "$REGISTRY/closer-web:$SHA" -t "$REGISTRY/closer-web:latest" ./frontend
          docker push "$REGISTRY/closer-api:$SHA"
          docker push "$REGISTRY/closer-api:latest"
          docker push "$REGISTRY/closer-web:$SHA"
          docker push "$REGISTRY/closer-web:latest"
          echo "API_IMAGE=$REGISTRY/closer-api:$SHA" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$REGISTRY/closer-web:$SHA" >> "$GITHUB_ENV"

      - name: Deploy API service
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE_API }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Deploy web service
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE_WEB }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Record rollback tip
        run: |
          echo "Rollback: redeploy the previous image tag (prior github.sha) to both ECS services."
          echo "See docs/deploy.md#rollback."
