services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-closer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-closer}
      POSTGRES_DB: ${POSTGRES_DB:-closer}
    ports:
      - "5432:5432"
    volumes:
      - closer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  closer_pg:
